<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모아</title>
<meta name="description" content="TOPIKの単語・文法・書きを練習する自分用アプリ">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모아">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Layout: one narrow column app with two tabs (テスト / 単語帳). Celadon (청자) accent; A=vermilion, B=mustard, 追加=indigo set markers */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E4EBE8; --fg:#18231F; --muted:#5E6E68; --line:#D5DED9;
  --accent:#2F7D6D; --accent-ink:#FFFFFF; --a:#C2453A; --b:#B8860B; --c:#4B5FA8; --c2:#9B4F8A; --c3:#2F7FA6; --d:#5E8C31; --m:#7A4FB0; --l:#C8651B;
  --ok:#2E8B57; --ng:#C2453A; --ok-bg:#E2F2E8; --ng-bg:#F8E3E0; --tip-bg:#EAF3F0;
  --obj:#F6C9B8; --obj-line:#C2553A;
  --seg-on:#FFFFFF; --shadow:0 1px 2px rgb(24 35 31 / .08), 0 2px 8px rgb(24 35 31 / .06);
  --ko:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1A2421; --sunk:#151E1B; --fg:#E6EEEA; --muted:#93A59E; --line:#2C3A36;
  --accent:#5FB8A5; --accent-ink:#0E1513; --a:#E8786C; --b:#E0B44A; --c:#97A8E8; --c2:#D79BCB; --c3:#8CC3E6; --d:#9CCB6B; --m:#B79BE8; --l:#EFA060;
  --ok:#6FCF97; --ng:#EF8A7E; --ok-bg:#1D3326; --ng-bg:#3A2220; --tip-bg:#1C2D29; --seg-on:#2B3A36; --shadow:0 1px 2px rgb(0 0 0 / .3); --obj:#5E3328; --obj-line:#F09A7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1A2421; --sunk:#151E1B; --fg:#E6EEEA; --muted:#93A59E; --line:#2C3A36;
  --accent:#5FB8A5; --accent-ink:#0E1513; --a:#E8786C; --b:#E0B44A; --c:#97A8E8; --c2:#D79BCB; --c3:#8CC3E6; --d:#9CCB6B; --m:#B79BE8; --l:#EFA060;
  --ok:#6FCF97; --ng:#EF8A7E; --ok-bg:#1D3326; --ng-bg:#3A2220; --tip-bg:#1C2D29; --seg-on:#2B3A36; --shadow:0 1px 2px rgb(0 0 0 / .3); --obj:#5E3328; --obj-line:#F09A7E; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--jp);font-size:15px;line-height:1.6;padding-inline:16px}
.wrap{max-width:480px;margin:0 auto;padding-block:20px 24px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--jp);font-weight:700;font-size:1.45rem;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.3}
.hd{display:flex;flex-direction:column;gap:4px}
.hd-sub{margin:0;display:flex;gap:6px;flex-wrap:wrap}
.hd-sub span{font-size:.75rem;font-weight:500;color:var(--muted);background:var(--sunk);border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums}
.hd-sub span.is-weak{color:var(--ng);background:var(--ng-bg)}
h1.ko{font-family:var(--ko);font-size:1.6rem}
h1 small{display:block;font-family:var(--jp);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--seg-on);color:var(--fg);box-shadow:var(--shadow)}
.tabs button{white-space:nowrap;font-size:.88rem;padding:9px 2px}
.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.group{display:flex;flex-direction:column}
.seg button{font:inherit;cursor:pointer;color:var(--fg);transition:background-color .15s,color .15s,box-shadow .15s}
.seg button:disabled{opacity:.38;cursor:not-allowed}
/* 出題範囲：タイル */
.seg.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg.tiles button{font-weight:700;padding:11px 8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3}
.seg.tiles button small{font-size:.72rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.seg.tiles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.seg.tiles button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.seg.tiles button[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
/* 出題範囲：リスト */
.seg.srcs{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:12px 14px;border:0;background:transparent;text-align:left;font-weight:700;font-size:.98rem}
.srow+.srow{border-top:1px solid var(--line)}
.srow .dot{margin:0}
.srow .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.srow[aria-pressed="true"] .sn{font-weight:700}
.srow .sc{font-size:.8rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.srow[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.srow[aria-pressed="true"] .ck{border:0;background:var(--accent);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent) 9%,var(--surface))}
.seg.quick{margin-top:8px}
.seg.quick button small{font-weight:500;font-size:.72rem;opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
.srow{grid-template-columns:auto minmax(0,1fr) auto auto;row-gap:6px}
.srow .sbar{grid-column:2 / 4;height:3px;border-radius:99px;background:var(--sunk);overflow:hidden}
.srow .sbar i{display:block;height:100%;background:var(--ok)}
.srow .lvt{font-size:.66rem;font-weight:700;margin-left:6px;padding:0 6px;border-radius:5px;color:var(--m);border:1px solid var(--m);vertical-align:1px}
.srow .lvt.beg{color:var(--muted);border-color:var(--line)}
.srow .sdone{font-size:.72rem;font-weight:700;color:var(--ok);margin-right:8px}
.hd-sub span.is-done{color:var(--ok);background:var(--ok-bg)}
.stk{display:inline-flex;gap:3px;align-items:center;margin-left:8px;vertical-align:1px}
.stk i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background-color .2s}
.stk i.on{background:var(--ok)}
.stk.reset i{background:color-mix(in srgb,var(--ng) 35%,var(--line))}
.stk.done{font-size:.68rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:1px 8px;letter-spacing:.04em}
.stk.pop{animation:pop .5s ease}
.stk small{font-size:.66rem;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}
.stk.due,.dueb{font-style:normal;font-size:.68rem;font-weight:700;color:var(--b);background:color-mix(in srgb,var(--b) 15%,var(--surface));border-radius:99px;padding:1px 8px;white-space:nowrap}
.hd-sub span.is-due{color:var(--b);background:color-mix(in srgb,var(--b) 15%,var(--surface))}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.doneb{font-style:normal;font-size:.7rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:1px 8px;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.mrow .stk{margin-left:0}
.mrow .del{margin-left:auto}
.donechips{display:flex;flex-wrap:wrap;gap:6px}
.donechips span{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:4px 10px;font-size:.82rem}
.donechips b{font-family:var(--ko);font-size:.98rem;margin-right:6px}
[hidden]{display:none!important}
.trend .trows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.trow{font:inherit;color:var(--fg);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;cursor:pointer}
.trow:last-child{border-bottom:0}
.trow b{font-size:.95rem}
.trow .tn{font-size:.82rem;font-weight:700;color:var(--ng);font-variant-numeric:tabular-nums}
.trow small{grid-column:1 / 3;font-size:.76rem;color:var(--muted)}
.trow .ck{grid-row:1 / 3;grid-column:3;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.trow[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-radius:10px}
.trow[aria-pressed="true"] .ck{border:0;background:var(--accent);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent) 9%,var(--surface))}
.thint{margin:0;font-size:.76rem;color:var(--muted)}
.udt{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:.84rem}
.udt th,.udt td{border-bottom:1px solid color-mix(in srgb,var(--accent) 18%,transparent);padding:6px 4px;text-align:left;vertical-align:middle}
.udt tbody tr:last-child th,.udt tbody tr:last-child td{border-bottom:0}
.udt thead th{font-size:.76rem;color:var(--muted);font-weight:700;white-space:nowrap}
.udt thead th svg{vertical-align:-2px;margin-right:4px}
.udt thead .up{color:var(--ok)} .udt thead .dn{color:var(--ng)}
.udt tbody th{font-weight:700;font-size:.8rem;line-height:1.35;white-space:nowrap;width:1%;padding-right:10px}
.udt tbody th small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.udt td span{display:inline-block;font-family:var(--ko);font-weight:700;font-size:.92rem;margin:1px 6px 1px 0;padding:0 4px;border-radius:6px}
.udt td span.off{color:var(--muted);font-weight:400}
.udt td span.on{background:var(--accent);color:var(--accent-ink)}
.udp{margin:0;font-size:.8rem;line-height:1.6}
.hjl,.col{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.hjl li{font-size:.84rem}
.hjo{color:var(--muted)}
.col li{display:flex;gap:10px;flex-wrap:wrap}
.col li span{color:var(--muted)}
.tlsvg{width:100%;max-width:320px;height:auto;display:block;margin:4px 0 6px}
/* 絵で見る */
.pics{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin-top:6px}
.pic{margin:0;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pic svg{width:100%;max-width:130px;height:auto;display:block}
.pic figcaption{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.35}
.pic b{font-family:var(--ko);font-size:1.02rem}
.pic span{font-size:.74rem;color:var(--fg)}
.pic small{font-family:var(--ko);font-size:.72rem;color:var(--muted);word-break:keep-all}
.pic.ok{border-color:var(--ok)} .pic.ng{border-color:var(--ng)}
/* 今日のメニュー */
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.today .tdh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ex-l{display:flex;flex-direction:column}
.ex-l small{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.dl{font-size:1.05rem;font-weight:700;line-height:1.2}
.dl span{font-family:var(--ko);font-size:2.1rem;color:var(--accent);margin:0 3px;font-variant-numeric:tabular-nums}
.dl.small{font-size:1.1rem}
.goal{font:inherit;display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--accent);border-radius:12px;padding:5px 14px;cursor:pointer;line-height:1.2}
.goal small{font-size:.65rem;font-weight:700}
.goal b{font-size:1.15rem}
.goaledit{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.goaledit label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
.goaledit input{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.primary.sm{padding:10px;font-size:.92rem}
.tasks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0;padding-bottom:0}
.tck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.task.done .tck{border:0;background:var(--ok);box-shadow:inset 0 0 0 5px var(--ok-bg)}
.tt{display:flex;flex-direction:column;min-width:0}
.tt b{font-size:.95rem}
.tt small{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .tt b{color:var(--muted)}
.tr{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.task.done .tr{color:var(--ok)}
.tgo{font:inherit;font-size:.82rem;font-weight:700;border:0;border-radius:10px;padding:7px 12px;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.task.done .tgo{background:var(--sunk);color:var(--fg)}
.sech{font-size:.95rem;margin:6px 0 -6px;color:var(--fg)}
/* 設定：セグメント */
.settings{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.seg.pills{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg.pills button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:.88rem;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.pills button[aria-pressed="true"]{background:var(--seg-on);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.seg.chipset{display:flex;flex-wrap:wrap;gap:6px}
.seg.chipset button{font-size:.82rem;font-weight:500;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.seg.chipset button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.mode-hint{border-top:1px solid var(--line);padding-top:12px}
/* はじめる（下に固定） */
.startbar{position:sticky;bottom:0;margin-inline:-16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,color-mix(in srgb,var(--bg) 0%,transparent));display:flex;flex-direction:column;gap:6px;z-index:2}
.startbar .status:empty{display:none}
.startbar .primary{display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px 14px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.startbar .primary span{font-size:1.02rem}
.startbar .primary small{font-size:.74rem;font-weight:500;opacity:.85}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;flex:none}
.dot.A{background:var(--a)} .dot.B{background:var(--b)} .dot.D{background:var(--d)} .dot.M{background:var(--m)} .dot.L{background:var(--l)} .dot.C,.dot.C0{background:var(--c)} .dot.C1{background:var(--c2)} .dot.C2{background:var(--c3)}
.primary{font:inherit;font-weight:700;font-size:1rem;padding:14px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{font:inherit;font-weight:500;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:12px}
.topbar .quit{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;font-size:.85rem}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:220px;justify-content:center;position:relative}
.tag{position:absolute;top:12px;left:14px;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.speak{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;font-size:1rem;line-height:1}
.card .speak{position:absolute;top:8px;right:8px}
.q{font-size:2.6rem;font-weight:700;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.q.ko{font-family:var(--ko)} .q.jp{font-family:var(--jp);font-size:1.7rem}
.ans{font-size:1.25rem;text-align:center}
.ans.ko{font-family:var(--ko);font-size:1.8rem;font-weight:700}
.ex{font-size:.88rem;color:var(--muted);text-align:center;margin:0}
.ex b{font-family:var(--ko);font-weight:700;color:var(--fg);font-size:.98rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-ok,.btn-ng{font:inherit;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;border:1.5px solid}
.btn-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.btn-ng{background:var(--ng-bg);color:var(--ng);border-color:var(--ng)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{font:inherit;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.choices.ko button{font-family:var(--ko);font-size:1.15rem;font-weight:700}
.choices button.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choices button.wrong{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.choices button:disabled{cursor:default}
.confused{margin:0;font-size:.85rem;color:var(--ng);text-align:center}
.confused b{font-family:var(--ko);font-size:1rem}
.tip{background:var(--tip-bg);border-radius:12px;padding:10px 14px;font-size:.88rem;line-height:1.55}
.tip b{font-family:var(--ko)}
.tip .tl{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--accent);display:block;margin-bottom:2px}
.score{font-family:var(--ko);font-size:3rem;font-weight:700;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;color:var(--muted)}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin:0}

/* 単語帳 */

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list details{border-top:1px solid var(--line)}

.list summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 14px;cursor:pointer}

.list summary b{font-family:var(--ko);font-size:1.15rem;display:flex;align-items:baseline}
.list summary span{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list details[open] summary span{white-space:normal}

.weakb.rp{color:var(--ng-bg);background:var(--ng)}
.trow.rw b{color:var(--ng)}
.wkst{margin:0;font-size:.82rem;color:var(--muted)}

.wkst i{font-style:normal;display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}

.wkst i span.on{background:var(--ok)}
.entry{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
.entry .exrow{display:flex;gap:6px;align-items:flex-start}
.entry .exrow div{min-width:0}
.entry .exk{font-family:var(--ko);font-size:1.02rem}
.entry .exj{font-size:.85rem;color:var(--muted)}
.sim{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sim .l{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.sim button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:3px 9px;cursor:pointer}

.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:.9rem}
.addbox{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.addbox summary{padding:12px 14px;font-weight:700;cursor:pointer;color:var(--accent)}
.addin{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.addform{display:grid;gap:10px}
.addbox label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
.addbox label.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--fg)}
.addbox input:not([type=checkbox]),.addbox textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;box-sizing:border-box;resize:vertical}
.addbox input.ko,.addbox textarea.ko{font-family:var(--ko);font-size:1.05rem}
.addbox .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost.sm{padding:8px;font-size:.85rem}
.pv-h{font-size:.8rem;font-weight:700;color:var(--muted);margin:4px 0 6px}
.plist{border:1px solid var(--line);border-radius:12px;max-height:340px;overflow:auto;margin-bottom:10px}
.prow{display:grid!important;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px!important;align-items:baseline;padding:9px 12px;border-top:1px solid var(--line);font-size:.9rem!important;color:var(--fg)!important}
.prow:first-child{border-top:0}
.prow b{font-family:var(--ko);font-size:1.02rem}
.prow span{min-width:0}
.prow small{display:block;color:var(--muted);font-family:var(--ko);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.prow.off{opacity:.55}
.status{font-size:.82rem;margin:0;min-height:1.2em;color:var(--muted)}
.status.err{color:var(--ng)}
.del{font:inherit;font-size:.8rem;align-self:flex-start;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer}
.del.arm{border-color:var(--ng);color:var(--ng);background:var(--ng-bg)}
.note{font-size:.88rem;line-height:1.55}
/* 穴埋め */

.sent{font-family:var(--ko);font-size:1.45rem;line-height:1.7;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.blank{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--accent);margin:0 .15em;color:var(--muted);font-family:var(--jp);font-size:.62em;font-weight:500;letter-spacing:.06em;line-height:1.5;vertical-align:.15em;text-align:center}
.fill{color:var(--accent);border-bottom:2.5px solid var(--accent)}
.sent-j{margin:0;font-size:.88rem;color:var(--muted);text-align:center}
.ans small{display:block;font-family:var(--jp);font-weight:400;font-size:.9rem;color:var(--muted)}
.cform{display:flex;align-items:baseline;gap:8px;font-family:var(--ko);font-size:1rem;color:var(--muted)}
.cform span{font-family:var(--jp);font-size:.95rem;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:8px;padding:2px 10px}
.inline-ko{font-family:var(--ko);color:var(--fg)}
/* 書いて答える */
.typer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.typer input{font-family:var(--ko);font-size:1.3rem;font-weight:700;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.typer .primary{width:auto;padding-inline:20px}
.typer.is-right input{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.typer.is-wrong input{border-color:var(--ng);background:var(--ng-bg);color:var(--ng)}
.giveup{align-self:center}
.typed{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px}

.typed div+div{border-top:1px solid var(--line)}
.typed span{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.typed b{font-family:var(--ko);font-size:1.3rem;letter-spacing:.04em}
.typed small{grid-column:2;font-size:.8rem;color:var(--muted)}
.typed mark{background:var(--ng-bg);color:var(--ng);border-radius:4px;padding:0 1px}
.typed mark.gap{background:none}
.verdict{margin:0;text-align:center;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.near{color:var(--b)}
/* 韓国語は単語の途中で折り返さない */
.gs,.sent,.exk,.wtext,.ex,.q,.fb-mine,.fb-fix,.wm ul,.galts{word-break:keep-all}
/* 書き 53 */
.t53{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.t53 summary{padding:12px 0;font-weight:700;color:var(--accent);cursor:pointer}

.t53r{display:flex;gap:6px;align-items:flex-start}
.t53r>div{min-width:0}
.wtext53{font-family:var(--ko);margin:0;font-size:.98rem;word-break:keep-all}
.wfig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.wwho,.winfo{margin:0;font-family:var(--ko);font-size:.9rem;word-break:keep-all}
.wwho{color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.c53{margin:0;display:grid;gap:7px}
.c53 figcaption{font-family:var(--ko);font-weight:700;font-size:.92rem}
.c53 figcaption small{font-family:var(--jp);font-weight:500;font-size:.72rem;color:var(--muted);margin-left:4px}
.c53r{display:grid;grid-template-columns:4.6em minmax(0,1fr) 2.4em;align-items:center;gap:8px}
.c53l{font-family:var(--ko);font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c53b{height:12px}
.c53b i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.c53v{font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.wans label{display:flex;align-items:center}
.wcnt{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.wcnt.ok{color:var(--ok)} .wcnt.ng{color:var(--b)}
.m53{font-family:var(--ko);line-height:1.8;margin:0;word-break:keep-all}
.m54{white-space:pre-line}
.q54{margin:0;padding-left:1.3em;font-family:var(--ko);font-size:.92rem;display:grid;gap:4px;word-break:keep-all}
.fb-miss{color:var(--ng);font-size:.85rem}
/* 文法 */
.glist{display:flex;flex-direction:column}

.gitem summary::-webkit-details-marker{display:none}
.gitem+.gitem{border-top:1px solid var(--line)}
.gno{font-size:.75rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}

.gitem summary.two{grid-template-columns:minmax(0,1fr) auto}
.gitem .gst{color:inherit;white-space:nowrap}
.gm b{font-family:var(--ko);font-size:1.05rem;display:block}
.gm small{font-size:.75rem;color:var(--muted)}
.gforms{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gforms .l{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-right:2px}

.gex{border-top:1px dashed var(--line);padding-top:10px}
.gex .exk b{color:var(--accent);font-weight:700}
.galts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-family:var(--ko);font-size:.9rem;color:var(--muted)}
.galts.big{flex-direction:column;gap:6px;color:var(--fg);font-size:1rem;margin:4px 0}

.gnote{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.gask{margin:0;font-family:var(--ko);font-size:.92rem;color:var(--muted)}
.gcard{min-height:180px;padding-top:36px}
.gs{font-family:var(--ko);font-size:1.3rem;line-height:1.8;text-align:center;overflow-wrap:anywhere;text-wrap:balance}

.subtabs small{font-weight:500;font-size:.75rem;margin-left:5px;font-variant-numeric:tabular-nums}
.rngs{display:grid;gap:8px}
.rng{align-items:center}
.rng-l{font-size:.72rem;font-weight:700;color:var(--muted);width:2.4em;flex:none}
.seg.chipset button small{font-weight:500;font-size:.72rem;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.stype{font-family:var(--jp);font-size:.68rem;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 7px;margin-right:8px;vertical-align:2px}
.ssec{scroll-margin-top:12px}

.dr{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;align-items:baseline}
.dr b{font-family:var(--ko);font-size:.9rem;overflow-wrap:anywhere}
.dr span{color:var(--muted);font-size:.84rem}
.fbk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}

.fr b{font-family:var(--ko);font-size:1.08rem;margin-right:8px}
.fr span{font-size:.9rem}
.fpt{margin:0;font-size:.88rem;border-top:1px solid var(--line);padding-top:10px}
.fdiff{background:var(--tip-bg);border-radius:10px;padding:9px 12px;display:grid;gap:4px}
.fdiff .tl{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.ssec{display:flex;flex-direction:column;gap:8px}
.sdiff{background:var(--tip-bg);border-radius:12px;padding:10px 14px;display:grid;gap:6px;font-size:.85rem}
.sdiff .tl{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.sdiff b{font-family:var(--ko);font-size:.92rem}
.sdiff p{margin:0;color:var(--muted)}
.gcat{color:var(--muted);font-size:.72rem;white-space:nowrap}
.ngtip{background:var(--ng-bg)}
.lvb{font-style:normal;font-family:var(--jp);font-size:.62rem;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:5px;padding:0 5px;margin-left:8px;vertical-align:3px}
.seg.pills button small{font-weight:500;font-size:.72rem;opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
.gpt{display:block;font-size:.82rem;color:var(--muted)}
.ngtip .tl{color:var(--ng)}
/* 書き 51・52 */
.wrow{font:inherit;color:var(--fg);background:none;border:0;border-top:1px solid var(--line);width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;text-align:left;cursor:pointer}
.list .wrow:first-child{border-top:0}
.wid{font-size:.75rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.wt b{font-family:var(--ko);font-size:1.02rem;display:block}
.wt small{color:var(--muted);font-size:.8rem}
.wst{font-size:.75rem;color:var(--muted);white-space:nowrap}
.wst.done{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.wq{display:flex;flex-direction:column;gap:6px}
.wtext{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:var(--ko);font-size:1.02rem;line-height:1.85;overflow-wrap:anywhere}
.wblank{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;padding:0 .4em;margin:0 .1em;border:1.5px solid var(--accent);border-radius:6px;color:var(--accent);font-family:var(--jp);font-weight:700;font-size:.9em;line-height:1.5;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

.wans label{font-weight:700}
.wans textarea{font-family:var(--ko);font-size:1.05rem;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;resize:vertical;line-height:1.6}
.warn{margin:0;font-size:.8rem;color:var(--b);min-height:0}

.whint{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}

.wbtns{display:grid;gap:8px}

.lists{display:flex;flex-direction:column;gap:8px}

.addbox select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}

/* 細かい設定（たたみ） */

  return `<div class="tip"><span class="tl">漢字で覚える</span><b>${esc(w.k)}</b>＝${esc(h)}（${map}）${lines?`<ul class="hjl">${lines}</ul>`:""}</div>`;

function ruConj(w){
  const k=w.k;
  if(!/르다$/.test(k) || k.length<3 || ["따르다","들르다","치르다","이르다","푸르다"].includes(k)) return null;
  const pre=k.slice(0,-2), last=pre.slice(-1), code=last.charCodeAt(0)-0xAC00;
  if(code<0||code>11171||code%28!==0) return null;
  const v=Math.floor(code/28)%21, bright=(v===0||v===8);
  const base=pre.slice(0,-1)+String.fromCharCode(last.charCodeAt(0)+8);
  return {yo:base+(bright?"라요":"러요"), past:base+(bright?"랐어요":"렀어요")};
}

const TRENDS = [

  {id:"adv", name:"副詞", how:"一緒に使う形で覚える", test:w=>!!advOf(w)},
  {id:"ru", name:"르変則", how:"골라요の形から元の形に戻す", test:w=>!!ruConj(w)}
];
const trendList = id => { const t=TRENDS.find(x=>x.id===id); return t ? ALL.filter(w=>weak[w.k] && t.test(w)) : [] };

function trendCard(){

  const rl = repeatList();
  if(!rows.length && !udWords().length && !rl.length) return "";
  return `<section class="today trend"><div class="ex-l"><small>苦手の傾向と対策</small><span class="dl small">苦手 ${weakList().length}語の内訳</span></div>

// ---------- 字形の近さ ----------
function jamo(s){
  const out=[];
  for(const ch of s){
    const c=ch.charCodeAt(0)-0xAC00;
    if(c<0||c>11171){out.push(ch);continue}
    out.push("i"+Math.floor(c/588),"m"+Math.floor(c/28)%21);
    if(c%28) out.push("f"+c%28);
  }
  return out;
}
function lev(a,b){
  const d=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
const notesFor = k => NOTES.filter(n=>n.w.includes(k));
const paired = (x,y) => NOTES.some(n=>n.w.includes(x)&&n.w.includes(y));
function sim(x,y){
  const ja=jamo(x),jb=jamo(y);
  let s = 1 - lev(ja,jb)/Math.max(ja.length,jb.length);
  const sx=[...x], sy=[...y];
  if(sx[0]===sy[0]) s+=.35;
  s += sx.filter(c=>sy.includes(c)).length*.15;
  if(sx.length===sy.length) s+=.1;
  if(paired(x,y)) s+=.8;
  if(udCls(x) && udCls(y)) s+=.6;
  return s;
}
function lookalikes(w,n,jitter=.12,keep=()=>true){
  return ALL.filter(x=>x.k!==w.k && x.j!==w.j && keep(x))
    .map(x=>({x,s:sim(w.k,x.k)+Math.random()*jitter}))
    .sort((a,b)=>b.s-a.s).slice(0,n).map(o=>o.x);
}

function conjInfo(w){

  const last=dec(stem.slice(-1)); if(!last) return null;
  let irr = CONJ_IRR[w.k] || null;
  if(!irr && /하$/.test(stem)) irr="하";
  if(!irr && last.f===F.l) irr="ㄹ";
  const builtin = (typeof BUILTIN==="undefined") || BUILTIN.some(x=>x.k===w.k);
  if(!builtin && !irr && (last.f===F.b||last.f===F.d||last.f===F.s||/르$/.test(stem))) return null; // 不規則かもしれない追加単語は除外

// 아/어 形（요の前）。alt=許容する別形
function aForm(stem,irr,flip){
  const pre=stem.slice(0,-1), L=stem.slice(-1), d=dec(L);
  const br = flip ? !bright(d.v) : bright(d.v);

  if(stem==="피") return {m:"피어", alt:["펴"]};
  if(irr==="ㄷ") return {m:pre+setF(L,F.l)+(br?"아":"어")};
  if(irr==="ㅂ"){ const b=setF(L,0); return {m:pre+b+((stem==="돕"||stem==="곱")?"와":"워")} }
  if(irr==="ㅅ") return {m:pre+setF(L,0)+(br?"아":"어")};
  if(irr==="르"){ const p=dec(pre.slice(-1)); const pb=bright(p.v); return {m:pre.slice(0,-1)+setF(pre.slice(-1),F.l)+(pb?"라":"러")} }
  if(d.f!==0) {
    const m=pre+L+(br?"아":"어");
    if(d.v===V.o && d.f===27 && !flip) return {m, alt:[pre+com(d.c,V.wa,0)]}; // 놓아→놔
    return {m};
  }
  switch(d.v){
    case V.a: case V.eo: case V.yeo: case V.ae: case V.e: return {m:stem};
    case V.o: { const m=pre+com(d.c,V.wa,0); return d.c===CHO_IEUNG?{m}:{m,alt:[stem+"아"]} }
    case V.u: { const m=pre+com(d.c,V.wo,0); return d.c===CHO_IEUNG?{m}:{m,alt:[stem+"어"]} }
    case V.i: return {m:pre+com(d.c,V.yeo,0)};
    case V.oe: return {m:pre+com(d.c,V.wae,0), alt:[stem+"어"]};

const addSS = s => s.slice(0,-1)+setF(s.slice(-1),F.ss);

  const flip = variant==="flip";
  const pre=stem.slice(0,-1), L=stem.slice(-1), d=dec(L);
  const vowelEnd = d.f===0;
  const A = aForm(stem,irr,flip);
  const withAlt = (fn) => ({m:fn(A.m), alt:(A.alt||[]).map(fn)});
  switch(form){
    case "yo":   return withAlt(a=>a+"요");
    case "past": return withAlt(a=>addSS(a)+"어요");
    case "seo":  return withAlt(a=>a+"서");
    case "hap":
      if(variant==="swap") return {m: vowelEnd||irr==="ㄹ" ? stem+"습니다" : pre+setF(L, F.b)+"니다"};
      if(irr==="ㄹ") return {m:pre+setF(L,F.b)+"니다"};
      return {m: vowelEnd ? pre+setF(L,F.b)+"니다" : stem+"습니다"};
    case "han":
      if(variant==="swap") return {m: adj ? (vowelEnd||irr==="ㄹ" ? pre+setF(L,F.n)+"다" : stem+"는다") : w.k};
      if(adj) return {m:w.k};
      if(irr==="ㄹ") return {m:pre+setF(L,F.n)+"다"};
      return {m: vowelEnd ? pre+setF(L,F.n)+"다" : stem+"는다"};
    case "myeon":
      if(variant==="swap") return {m: vowelEnd||irr==="ㄹ" ? stem+"으면" : stem+"면"};
      if(irr==="ㄷ") return {m:pre+setF(L,F.l)+"으면"};
      if(irr==="ㅂ") return {m:pre+setF(L,0)+"우면"};
      if(irr==="ㅅ") return {m:pre+setF(L,0)+"으면"};

function conjAnswer(w,form){ const r=conjugate(w,form); return r?{m:r.m, all:[r.m,...(r.alt||[])]}:null }
function conjDistractors(w,form,n){
  const ans=conjAnswer(w,form), bad=new Set(ans.all), out=[];
  const push = s => { if(s && !bad.has(s) && !out.includes(s)) out.push(s) };
  ["regular","flip","swap"].forEach(v=>{ const r=conjugate(w,form,v); if(r) push(r.m) });
  // 縮約しない誤り（나오아요 など）
  const info=conjInfo(w);
  if(info && ["yo","past","seo"].includes(form) && dec(info.stem.slice(-1)).f===0 && (!info.irr || info.irr==="하")){
    const ends = form==="yo"?["아요","어요"]:form==="past"?["았어요","었어요"]:["아서","어서"];
    ends.forEach(e=>push(info.stem+e));
  }
  // 規則化＋母音反転の組み合わせ
  if(info && info.irr && info.irr!=="하"){ const st=info.stem; const r=aForm(st,null,true); if(["yo","past","seo"].includes(form)) push(form==="yo"?r.m+"요":form==="past"?addSS(r.m)+"어요":r.m+"서") }

const BLANK_OV = {"떠오르다":"떠올랐어요","걷다":"걸어요","묻다":"물어봤어요","돕다":"도왔어요","쉽다":"쉬워요","짓다":"지었어요","두다":"뒀어요","다르다":"달라요","추다":"췄어요","기르다":"길러요","-지 말다":"지 마세요","눕다":"누웠어요","쏘다":"쏠게요"};

const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const blankCache = new Map();
function blankOf(w){
  if(!w.ex) return null;
  const key=w.k+"\u0000"+w.ex;
  if(blankCache.has(key)) return blankCache.get(key);
  let r=null;
  const find = t => { const m=w.ex.match(new RegExp("(^|\\s)("+reEsc(t)+")")); return m?m.index+m[1].length:-1 };
  if(w.blank && w.ex.includes(w.blank)) r=w.blank;
  else if(BLANK_OV[w.k] && w.ex.includes(BLANK_OV[w.k])) r=BLANK_OV[w.k];
  else if(!isPred(w)){
    const i=find(w.k); if(i>=0) r=w.k; else if(w.ex.includes(w.k)) r=w.k;
  } else {
    const stem=w.k.slice(0,-1), tries=[stem];
    if(stem.length>=2) tries.push(stem.slice(0,-1));
    for(const t of tries){ const i=find(t); if(i>=0){ r=w.ex.slice(i).match(/^[^\s.,!?]+/)[0]; break } }
  }
  blankCache.set(key,r);
  return r;
}

  return esc(w.ex.slice(0,i))+mid+esc(w.ex.slice(i+b.length));
}

function modeHint(){

    ? "例文の空欄に入る単語をハングルで書きます。辞書形（例：걷다）でも、文の中の形（例：걸어요）でも正解です。韓国語キーボードが必要です。"
    : "日本語を見て、韓国語をハングルで書きます。韓国語キーボードが必要です。";

function start(words){
  if(opt.form==="cloze") words = words.filter(blankOf);
  if(opt.form==="conj") words = words.filter(conjInfo).map(w=>Object.assign({},w,{_cf: opt.cform&&opt.cform!=="mix" ? opt.cform : CONJ_FORMS[Math.floor(Math.random()*CONJ_FORMS.length)].id}));
  let list = shuffle(words);
  if(opt.n!=="all") list = list.slice(0, +opt.n);
  if(!list.length) return false;
  view="quiz";
  run = {list, i:0, miss:[], ok:0};
  question();
  return true;
}

function exLine(w){
  const c = chunkOf(w);
  const chunk = c?`<p class="chunk"><span>セットで</span>${esc(c)}</p>`:"";
  if(!w.ex) return chunk;
  const b = blankOf(w);
  const hl = b ? esc(w.ex).replace(esc(b), m=>`<b>${m}</b>`) : esc(w.ex);
  return `<p class="ex">${hl}<br>${esc(w.exj||"")}</p>${chunk}`;
}
function tipBlock(a,b){
  const n = NOTES.find(n=>n.w.includes(a)&&n.w.includes(b));
  return n?`<div class="tip"><span class="tl">見分けポイント</span>${n.t}</div>`:"";
}
const norm = s => String(s||"").normalize("NFC").replace(/[\s.,!?。、？！\-~〜～]/g,"");
function diffHtml(got,want){
  const g=[...got], t=[...want];
  return g.map((c,i)=>c===t[i]?esc(c):`<mark>${esc(c)}</mark>`).join("") + (g.length<t.length?`<mark class="gap">${"・".repeat(t.length-g.length)}</mark>`:"");
}

function question(){
  if(run.list[run.i]._cf) return conjQuestion();
  const w = run.list[run.i];
  const cloze = opt.form==="cloze" && !!blankOf(w), typed = opt.mode==="type";
  const k2j = !cloze && !typed && opt.dir==="k2j";
  curCountable = !(opt.mode==="choice" && k2j);
  const pct = run.i/run.list.length*100;

  let prompt;
  if(cloze){
    prompt = `<div class="sent" id="sent">${clozeHtml(w,false)}</div>
      <p class="sent-j">${esc(w.exj||"")}</p>
      <div class="ans ko" id="ans" hidden>${esc(w.k)}<small>${esc(w.j)}</small></div>
      <div id="exw" hidden>${chunkOf(w)?`<p class="chunk"><span>セットで</span>${esc(chunkOf(w))}</p>`:""}</div>`;
  } else {
    prompt = `<div class="q ${k2j?"ko":"jp"}">${esc(k2j?w.k:w.j)}</div>
      <div class="ans ${k2j?"":"ko"}" id="ans" hidden>${esc(k2j?w.j:w.k)}</div>
      <div id="exw" hidden>${exLine(w)}</div>`;
  }

  let body;
  if(opt.mode==="choice"){
    let others;
    if(opt.set==="UD" && udCls(w.k)) others = udOthers(w);
    else if(cloze){
      const same = x => posOf(x)===posOf(w);
      others = opt.dist==="sim" ? lookalikes(w,3,.12,same) : shuffle(ALL.filter(x=>x.k!==w.k && same(x))).slice(0,3);
      if(others.length<3) others = others.concat(lookalikes(w,3-others.length,.12,x=>!others.includes(x)));
    } else {
      others = opt.dist==="sim" ? lookalikes(w,3) : shuffle(ALL.filter(x=>x.k!==w.k && x.j!==w.j)).slice(0,3);
    }
    const opts = shuffle([w,...others]);
    const koOpts = cloze || !k2j;
    body = `<div class="choices ${koOpts?"ko":""}">${opts.map(o=>`<button type="button" data-k="${esc(o.k)}">${esc(koOpts?o.k:o.j)}</button>`).join("")}</div>
            <div id="after"></div>
            <button class="primary" id="next" hidden>次へ</button>`;
  } else if(typed){
    body = `<form class="typer" id="tf" autocomplete="off">
              <input id="ti" lang="ko" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ハングルで入力" aria-label="答えをハングルで入力">
              <button class="primary" id="tsub">答える</button>
            </form>
            <button type="button" class="linkbtn giveup" id="giveup">わからない（答えを見る）</button>
            <div id="after"></div>
            <button class="primary" id="next" hidden>次へ</button>`;
  } else {
    body = `<button class="primary" id="reveal">答えを見る</button>
            <div id="after"></div>
            <div class="row" id="grade" hidden><button class="btn-ng" id="ng">× 出なかった</button><button class="btn-ok" id="ok">○ 覚えてた</button></div>`;
  }

  $app.innerHTML = `
  <div class="topbar"><button class="quit" id="quit">← やめる</button><div class="bar"><i style="width:${pct}%"></i></div><div class="count">${run.i+1} / ${run.list.length}</div></div>
  <div class="card ${cloze?"cloze":""}">
    <span class="tag"><span class="dot ${dotCls(w)}"></span>${esc(wSetName(w))}${advOf(w)?` · 副詞`:""}<span id="stk">${stkHtml(w.k)}</span></span>
    <span id="spk">${k2j?speakBtn(w.k):""}</span>
    ${prompt}
  </div>
  ${body}`;
  document.getElementById("quit").onclick=home;
  const ans=document.getElementById("ans"), exw=document.getElementById("exw"), after=document.getElementById("after");
  const sayText = cloze ? w.ex : w.k;
  function reveal(){
    ans.hidden=false; exw.hidden=false;
    if(cloze) document.getElementById("sent").innerHTML=clozeHtml(w,true);
    document.getElementById("spk").innerHTML=speakBtn(sayText);
    if(!k2j) speak(sayText);
  }
  function showNext(){ const n=document.getElementById("next"); n.hidden=false; n.onclick=next; n.focus() }

  if(opt.mode==="choice"){
    const btns=[...$app.querySelectorAll(".choices button")];
    btns.forEach(b=>b.onclick=()=>{
      const right = b.dataset.k===w.k;
      btns.forEach(x=>{x.disabled=true; if(x.dataset.k===w.k) x.classList.add("right")});
      if(!right) b.classList.add("wrong");
      const picked = ALL.find(x=>x.k===b.dataset.k);
      const ev=record(w,right,right?null:picked);
      reveal();
      if(right){ setTimeout(next, ev==="done"||ev==="kept"?1400:cloze?1300:(ev==="up"?900:650)) }
      else {
        after.innerHTML=`<p class="confused">選んだのは <b>${esc(picked.k)}</b>＝${esc(picked.j)}</p>${tipBlock(w.k,picked.k)}${picDiff(w.k,picked.k)}`;
        showNext();
      }
    });
  } else if(typed){
    const form=document.getElementById("tf"), inp=document.getElementById("ti"), give=document.getElementById("giveup");
    let composing=false, done=false;
    inp.addEventListener("compositionstart",()=>composing=true);
    inp.addEventListener("compositionend",()=>composing=false);
    const accept = [w.k]; if(cloze) accept.push(blankOf(w));
    function finish(got){
      done=true; inp.disabled=true; document.getElementById("tsub").disabled=true; give.hidden=true;
      const g=norm(got), right = !!g && accept.map(norm).includes(g);
      const other = !right && g ? ALL.find(x=>x.k!==w.k && norm(x.k)===g) : null;
      record(w,right,other||null);
      reveal();
      form.classList.add(right?"is-right":"is-wrong");
      if(right){
        after.innerHTML=`<p class="verdict ok">正解！${mastery.done[w.k]===today()&&streakOf(w.k)===MASTER_N?" 覚えた単語に入りました":""}</p>`;
      } else if(!g){
        after.innerHTML="";
      } else {
        const near = lev(jamo(g),jamo(w.k))<=2 || (cloze && lev(jamo(g),jamo(blankOf(w)))<=2);
        after.innerHTML=`<div class="typed">
            <div><span>あなた</span><b>${diffHtml(g, cloze&&[...g].length>[...w.k].length?blankOf(w):w.k)}</b></div>
            <div><span>正解</span><b>${esc(w.k)}</b>${cloze&&blankOf(w)!==w.k?`<small>文の中では ${esc(blankOf(w))}</small>`:""}</div>
          </div>
          ${other?`<p class="confused">それは <b>${esc(other.k)}</b>＝${esc(other.j)}</p>${tipBlock(w.k,other.k)}${picDiff(w.k,other.k)}`
                 :(near?`<p class="verdict near">おしい！つづりが少し違います</p>`:"")+picFor(w.k)}`;
      }
      showNext();
    }
    form.onsubmit=e=>{ e.preventDefault(); if(done||composing) return; if(!norm(inp.value)) { inp.focus(); return } finish(inp.value) };
    give.onclick=()=>{ if(!done) finish("") };
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}) }catch(e){} },50);
  } else {
    const rev=document.getElementById("reveal"), grade=document.getElementById("grade");
    rev.onclick=()=>{
      reveal(); rev.hidden=true; grade.hidden=false;
      const ns=notesFor(w.k);
      after.innerHTML=(ns.length?`<div class="tip"><span class="tl">似てる単語</span>${ns[0].t}</div>`:"")+picFor(w.k);
    };
    document.getElementById("ok").onclick=()=>{record(w,true);next()};
    document.getElementById("ng").onclick=()=>{record(w,false);next()};
  }
}

const cformOf = id => CONJ_FORMS.find(f=>f.id===id);

              <button class="primary" id="tsub">答える</button>

  } else {

            <div class="row" id="grade" hidden><button class="btn-ng" id="ng">× 出なかった</button><button class="btn-ok" id="ok">○ 覚えてた</button></div>`;
  }
  $app.innerHTML = `
  <div class="topbar"><button class="quit" id="quit">← やめる</button><div class="bar"><i style="width:${pct}%"></i></div><div class="count">${run.i+1} / ${run.list.length}</div></div>
  <div class="card">
    <span class="tag"><span class="dot ${dotCls(w)}"></span>${esc(wSetName(w))} · ${info.adj?"形容詞":"動詞"}</span>
    <span id="spk"></span>
    <div class="q ko">${esc(w.k)}</div>
    <p class="sent-j">${esc(w.j)}</p>
    <div class="cform"><span>${esc(f.l)}</span>${esc(f.s)}</div>
    <div class="ans ko" id="ans" hidden>${esc(ans.m)}${ans.all.length>1?`<small>${ans.all.slice(1).map(esc).join("・")} でもOK</small>`:""}</div>
  </div>
  ${body}`;
  document.getElementById("quit").onclick=home;
  const after=document.getElementById("after");
  const explain = () => (note?`<div class="tip"><span class="tl">ポイント</span>${esc(note)}</div>`:"") + hanNote;
  function reveal(){ document.getElementById("ans").hidden=false; document.getElementById("spk").innerHTML=speakBtn(ans.m); speak(ans.m) }
  function showNext(){ const n=document.getElementById("next"); n.hidden=false; n.onclick=next; n.focus() }
  if(opt.mode==="choice"){
    const btns=[...$app.querySelectorAll(".choices button")];
    btns.forEach(b=>b.onclick=()=>{
      const right = ans.all.includes(b.dataset.v);
      btns.forEach(x=>{x.disabled=true; if(ans.all.includes(x.dataset.v)) x.classList.add("right")});
      if(!right) b.classList.add("wrong");
      record(w,right,right?null:{k:b.dataset.v,j:""});
      reveal();
      if(right && !note && !hanNote){ setTimeout(next,700) }
      else { after.innerHTML=(right?`<p class="verdict ok">正解！</p>`:"")+explain(); showNext() }
    });
  } else if(opt.mode==="type"){
    const form=document.getElementById("tf"), inp=document.getElementById("ti"), give=document.getElementById("giveup");
    let composing=false, done=false;
    inp.addEventListener("compositionstart",()=>composing=true);
    inp.addEventListener("compositionend",()=>composing=false);
    function finish(got){
      done=true; inp.disabled=true; document.getElementById("tsub").disabled=true; give.hidden=true;
      const g=norm(got), right = !!g && ans.all.map(norm).includes(g);
      record(w,right,right||!g?null:{k:g,j:""});
      reveal();
      form.classList.add(right?"is-right":"is-wrong");
      after.innerHTML = right ? `<p class="verdict ok">正解！</p>${explain()}`
        : (g?`<div class="typed"><div><span>あなた</span><b>${diffHtml(g,ans.m)}</b></div><div><span>正解</span><b>${esc(ans.m)}</b></div></div>
              ${lev(jamo(g),jamo(ans.m))<=2?`<p class="verdict near">おしい！</p>`:""}`:"") + explain();
      showNext();
    }
    form.onsubmit=e=>{ e.preventDefault(); if(done||composing) return; if(!norm(inp.value)){ inp.focus(); return } finish(inp.value) };
    give.onclick=()=>{ if(!done) finish("") };
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}) }catch(e){} },50);
  } else {
    const rev=document.getElementById("reveal"), grade=document.getElementById("grade");
    rev.onclick=()=>{ reveal(); rev.hidden=true; grade.hidden=false; after.innerHTML=explain() };
    document.getElementById("ok").onclick=()=>{record(w,true);next()};
    document.getElementById("ng").onclick=()=>{record(w,false);next()};
  }
}

function record(w,right,picked){
  if(right){
    run.ok++;
    const we=weakHit(w.k, w._cf ? true : curCountable);   // 活用の正解も自分で思い出す形として数える
    if(we==="out") (run.wout=run.wout||[]).push(w);
    if(we==="half") (run.whalf=run.whalf||[]).push(w);
  }
  else { run.miss.push(Object.assign({},w,{picked})); weakMiss(w.k) }
  saveWeak();
  logToday("w",right);
  if(w._cf) return null;            // 活用練習は「覚えた」に数えない
  const ev=bumpStreak(w.k,right,curCountable);
  if(ev==="done") (run.mastered=run.mastered||[]).push(w);
  if(ev==="lost") (run.lost=run.lost||[]).push(w);
  const el=document.getElementById("stk"); if(el) el.innerHTML=stkHtml(w.k,ev);
  return ev;
}
function next(){ run.i++; run.i<run.list.length ? question() : result() }

function result(){
  view="result";
  const total=run.list.length, rate=Math.round(run.ok/total*100);
  const msg = rate===100?"全問正解！":rate>=80?"あと少し。間違えたのを詰めよう":rate>=50?"半分以上いけてる":"まずはカードで眺めるのもあり";
  const label = run.daily ? "今日の単語" : esc(opt.set==="DONE"?"覚えた":rangeName(opt.set))
    + (opt.form==="cloze"?" · 穴埋め":opt.form==="conj"?" · 活用":"") + (opt.mode==="type"?" · 書いて答える":"");
  $app.innerHTML = `
  <h1><small>結果</small>${label}</h1>
  <div class="card" style="min-height:0">
    <div class="score">${run.ok}<small> / ${total}</small></div>
    <p class="sub">${rate}% · ${msg}</p>
  </div>
  ${run.mastered?.length?`<div class="group"><div class="label">今回覚えた単語（${run.mastered.length}）</div>
    <div class="donechips">${run.mastered.map(w=>`<span><b>${esc(w.k)}</b>${esc(w.j)}</span>`).join("")}</div></div>`:""}
  ${run.lost?.length?`<p class="hint">間違えたので「覚えた」から外れた単語：${run.lost.map(w=>esc(w.k)).join("、")}</p>`:""}
  ${run.wout?.length?`<p class="hint">日を変えて${WEAK_CLEAR_N}回正解したので苦手から外れた単語：${[...new Set(run.wout.map(w=>w.k))].map(esc).join("、")}</p>`:""}
  ${run.whalf?.filter(w=>weak[w.k]).length?`<p class="hint">苦手から外れるまで、別の日にあと1回正解：${[...new Set(run.whalf.filter(w=>weak[w.k]).map(w=>w.k))].map(esc).join("、")}</p>`:""}
  ${run.miss.length?`<div class="group"><div class="label">出なかった単語（${run.miss.length}）</div>
    <div class="miss">${run.miss.map(missRow).join("")}</div></div>
    <button class="primary" id="retry">間違えたのだけもう一回</button>`:""}
  <button class="${run.miss.length?"ghost":"primary"}" id="again">同じ設定でもう一回</button>
  <button class="ghost" id="back">設定に戻る</button>`;
  const r=document.getElementById("retry"); if(r) r.onclick=()=>{const m=run.miss.map(({picked,...w})=>w); view="quiz"; run={list:shuffle(m),i:0,miss:[],ok:0}; question()};
  document.getElementById("again").onclick=()=> run.daily ? startDailyWords() : start(pool());
  if(run.daily){ const a=document.getElementById("again"); a.textContent = wordPlan().list.length ? `今日の残り ${wordPlan().list.length}語を続ける` : "もう少しやる" }
  document.getElementById("back").onclick=home;
}

function wText(p){
  return esc(p.text).replace(/\(\s*㉠\s*\)/,'<span class="wblank">㉠</span>').replace(/\(\s*㉡\s*\)/,'<span class="wblank">㉡</span>').replace(/\n/g,"<br>");
}
function styleWarn(p,ans){
  const t=norm(ans); if(!t) return "";
  const out=[];
  const sentences = String(ans).trim().split(/[.!?。]\s*(?=\S)/).length;
  if(sentences>1) out.push("一文で書きます（文が2つ以上あるようです）");
  if(p.no===52 && /(요|니다|니까|세요|십시오)$/.test(t)) out.push("52は -ㄴ/는다体で書きます（〜요・〜습니다で終わると減点）");
  if(p.no===51 && /다$/.test(t) && !/(니다)$/.test(t) && /니다/.test(p.text)) out.push("前後が -습니다体なので、〜다 ではなく -습니다体に合わせましょう");
  if(p.no===51 && /요$/.test(t) && /니다/.test(p.text) && !/세요$/.test(p.text.split(/\(\s*㉡\s*\)/)[1]||"")) out.push("前後が -습니다体なので、そろえると安全です");
  return out.join("／");
}

async function gradeWriting(p){
  const a=document.getElementById("wa").value.trim(), b=document.getElementById("wb").value.trim();
  const st=document.getElementById("wstat"), btn=document.getElementById("wgrade");
  if(!a && !b){ st.className="status err"; st.textContent="㉠か㉡に答えを書いてから添削できます"; return }
  const sample=await getSample(); if(!sample) return;
  const crit = p.no===52
    ? "書き言葉の -ㄴ/는다体（〜다）で書けているか。-요・-습니다で終わる答えは文体の減点"
    : "前後の文の文体（主に -습니다体）に合っているか";
  const prompt = `あなたはTOPIK II 쓰기の採点者です。${p.no}番（${p.no===51?"実用文":"説明文"}）の空欄問題の解答を採点してください。

問題文:
${p.text}

模範解答（参考。意味と形が合っていれば別の表現も正解）:
㉠: ${p.a.join(" / ")}
㉡: ${p.b.join(" / ")}

受験者の解答:
㉠: ${a||"（空欄）"}
㉡: ${b||"（空欄）"}

採点基準（各空欄5点、整数）:
- 前後の文脈に合った内容か
- 文法・語彙・つづりが正確か
- ${crit}
- 一文で書けているか
空欄は0点。

JSONだけで答えてください。形:
{"a":{"score":0,"comment":"日本語で1〜2文。良い点と直す点","fixed":"受験者の答えをできるだけ生かした修正案（韓国語の一文。直す必要がなければ受験者の答えのまま）"},"b":{"score":0,"comment":"","fixed":""},"advice":"全体へのひとこと（日本語で1文）"}`;
  wCtl?.abort(); wCtl=new AbortController();
  btn.disabled=true; st.className="status"; st.innerHTML=`添削中…（数十秒かかることがあります） <button class="linkbtn" id="wstop">止める</button>`;
  document.getElementById("wstop").onclick=()=>wCtl.abort();
  try{
    const fb = await sample.json(prompt,{signal:wCtl.signal});
    const clean = k => ({score:Math.max(0,Math.min(5,Math.round(+fb?.[k]?.score||0))), comment:String(fb?.[k]?.comment||""), fixed:String(fb?.[k]?.fixed||"")});
    const res = {a:clean("a"), b:clean("b"), advice:String(fb?.advice||"")};
    const rec = {a,b,fb:res};
    saveWriting(p.id,rec);
    if(view==="wprob" && wcur===p){ st.textContent=""; renderFeedback(p,res,rec) }
  }catch(e){
    if(view!=="wprob"||wcur!==p) return;
    const code=e?.code;
    st.className = code==="cancelled" ? "status" : "status err";
    st.textContent = code==="cancelled" ? "止めました"
      : (code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed") ? "このページからClaudeを使えないため、添削はできません。「模範解答と比べる」で確認してください"
      : code==="rate_limited" ? "利用が集中しています。少し時間をおいてもう一度押してください"
      : code==="invalid_json" ? "添削結果をうまく読み取れませんでした。もう一度押してください"
      : "添削できませんでした。通信状態を確認してもう一度押してください";
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) btn.hidden=true;
  }finally{ btn.disabled=false }
}
function renderFeedback(p,fb,rec){
  const out=document.getElementById("wout"); if(!out) return;
  const total=(fb.a?.score||0)+(fb.b?.score||0);
  const part = k => { const f=fb[k]||{}; const mine=rec[k]||""; return `<div class="fb">
    <div class="fb-h"><span class="wblank">${k==="a"?"㉠":"㉡"}</span><span class="fb-s s${f.score}">${f.score??0} / 5</span></div>
    <div class="fb-mine">${esc(mine)||"<i>（空欄）</i>"}</div>
    <p>${esc(f.comment)}</p>
    ${f.fixed&&norm(f.fixed)!==norm(mine)?`<div class="fb-fix"><span>修正案</span>${esc(f.fixed)}</div>`:""}
  </div>` };
  out.innerHTML = `<div class="fbbox">
    <div class="fb-total"><span>Claudeの採点（目安）</span><b>${total}</b><small>/ 10</small></div>
    ${part("a")}${part("b")}
    ${fb.advice?`<p class="fb-adv">${esc(fb.advice)}</p>`:""}
    <button class="linkbtn" id="wshowmodel">模範解答も見る</button>
  </div>`;
  document.getElementById("wshowmodel").onclick=()=>{ showModel(p); };
}

function saveWriting(id,rec){
  const prev=wdata[id]||{};
  const next=Object.assign({},prev,rec,{at:new Date().toISOString()});
  if(!("fb" in rec) && (rec.a!==prev.a || rec.b!==prev.b || rec.text!==prev.text)) delete next.fb; // 答えが変わったら古い添削は外す
  wdata=Object.assign({},wdata,{[id]:next});
  store.set("kq-writing",wdata);
  if(db && !dbFail){ db.doc("writing/"+id).set(next).catch(()=>{}) }
}

function gStart(items){

function gQuestion(){
  const it=grun.list[grun.i], para=gopt.form==="para";
  const pct=grun.i/grun.list.length*100;
  const pickAlt=it.alts[Math.floor(Math.random()*it.alts.length)];
  const correct = para ? pickAlt[0] : (Math.random()<.6 ? it.a : pickAlt[0]);
  const opts=shuffle([[correct,"ok"],...it.w.map(x=>[x[0],x[1]])]);
  $app.innerHTML = `
  <div class="topbar"><button class="quit" id="quit">← やめる</button><div class="bar"><i style="width:${pct}%"></i></div><div class="count">${grun.i+1} / ${grun.list.length}</div></div>
  <p class="gask">${para?"밑줄 친 부분과 의미가 가장 비슷한 것을 고르십시오.":"（　）에 들어갈 가장 알맞은 것을 고르십시오."}</p>
  <div class="card gcard">
    <span class="tag">${String(it.g.no).padStart(2,"0")} · ${esc(it.g.cat)}</span>
    <span id="spk"></span>
    <div class="gs" id="gs">${para?gSent(it,`<u>${esc(it.a)}</u>`):gSent(it,`<span class="blank">&nbsp;</span>`)}</div>
    <p class="sent-j" id="gj" ${para?"hidden":""}>${esc(it.j)}</p>
  </div>
  <div class="choices ko">${opts.map(([f,m],i)=>`<button type="button" data-i="${i}">${esc(f)}</button>`).join("")}</div>
  <div id="after"></div>
  <button class="primary" id="next" hidden>次へ</button>`;
  document.getElementById("quit").onclick=gramView;
  const btns=[...$app.querySelectorAll(".choices button")];
  btns.forEach(b=>b.onclick=()=>{
    const [f,m]=opts[+b.dataset.i], right=m==="ok";
    btns.forEach(x=>{ x.disabled=true; if(opts[+x.dataset.i][1]==="ok") x.classList.add("right") });
    if(!right) b.classList.add("wrong");
    logToday("g",right);
    if(right){ grun.ok++; delete gweak[it.id] } else { grun.miss.push({it,picked:[f,m]}); gweak[it.id]=(gweak[it.id]||0)+1 }
    saveGWeak();
    document.getElementById("gj").hidden=false;
    if(!para) document.getElementById("gs").innerHTML=gSent(it,`<b class="fill">${esc(correct)}</b>`);
    document.getElementById("spk").innerHTML=speakBtn(it.s.replace("{}",correct));
    const all=[[it.a,it.g.main],...it.alts];
    document.getElementById("after").innerHTML=`<div class="fbk">
      ${right?`<div class="fr ok"><span class="mk">○</span><div><small>正解！</small><b>${esc(f)}</b></div></div>`
             :`<div class="fr ng"><span class="mk">×</span><div><small>あなたの答え</small><b>${esc(f)}</b><span>${esc(m)}</span></div></div>
               <div class="fr ok"><span class="mk">○</span><div><small>正解</small><b>${esc(correct)}</b></div></div>`}
      <div class="fdiff"><span class="tl">同じ意味で言える形</span>
        ${all.map(([x,l])=>`<div class="dr"><b>${esc(x)}</b><span>${esc(l)}${isUpper(l)?" · 上級":""}</span></div>`).join("")}</div>
      <p class="fpt">${esc(it.g.note)}</p>

    const n=document.getElementById("next"); n.hidden=false; n.onclick=gNext; n.focus();
  });
}

  document.getElementById("gback").onclick=gramView;
}

// ---------- 今日のメニュー（試験日から逆算） ----------
const daysLeft = () => dayDiff(today(), exam.date);
const WD = ["日","月","火","水","木","金","土"];
const fmtDate = d => { const t=new Date(d+"T00:00:00"); return `${t.getMonth()+1}/${t.getDate()}（${WD[t.getDay()]}）` };
function wordPlan(){
  const due = ALL.filter(w=>isDue(w.k));
  const cont = ALL.filter(w=>!isDone(w.k) && streakOf(w.k)>0 && !countedToday(w.k));
  const startedToday = ALL.filter(w=>!isDone(w.k) && countedToday(w.k) && streakOf(w.k)===1).length;
  // 4級を目指すあいだ、新しく始めるのは中級・過去問・追加と、初級で苦手なものだけ（初級の残りは自由に練習で）
  const newOk = w => exam.goal<4 || !BEGIN_KEYS.has(w.k) || weak[w.k] || isRepeat(w.k);
  const fresh = ALL.filter(w=>!isDone(w.k) && streakOf(w.k)===0 && newOk(w));
  const dl = daysLeft();
  let quota;
  if(dl<=0) quota = 15;                                   // 試験後：ふつうのペース
  else if(dl < MASTER_N) quota = 0;                        // 直前：新しい単語は増やさない
  else {
    const newDays = Math.max(1, dl-(MASTER_N-1));          // 試験の前日までに3日分そろう最後の日まで
    quota = Math.min(40, Math.max(10, Math.ceil((fresh.length+startedToday)/newDays)));
  }
  const newN = Math.max(0, Math.min(fresh.length, quota-startedToday));
  const rank = w => (isRepeat(w.k)?0:weak[w.k]?10:20) + (/^過去問/.test(groupOf(w)||"")?0:isMid(w)?1:w.set==="L"?2:isFB(w)?3:w.set==="C"?4:w.set==="A"?5:w.set==="B"?6:7);   // 苦手→過去問→中級→4級→追加→初級
  const newPick = fresh.slice().sort((a,b)=>rank(a)-rank(b)).slice(0,newN);
  return {due, cont, newPick, quota, startedToday, list:[...due,...cont,...newPick]};
}
const gLvGoal = () => exam.goal>=4 ? 4 : 3;
const G_DAILY = 10;
function gramPlan(){
  const pool = S_ITEMS.filter(it=>it.g.lv<=gLvGoal() && !it.g.biz);   // 仕事の敬語は今日のメニューには入れない（範囲で選んで練習）
  const weakFirst = shuffle(pool.filter(it=>gweak[it.id])).concat(shuffle(pool.filter(it=>!gweak[it.id])));
  return {list: weakFirst.slice(0,G_DAILY), done: (todayLog().g||0)};
}
function writePlan(){
  const wroteToday = Object.values(wdata).some(d=>d?.at && dayOf(d.at)===today());
  // 4級を目指すあいだは 51〜54 を回す（書いた数が少ない番号から）
  const pool = exam.goal>=4 ? [...WRITE,...P53,...P54] : WRITE;
  const typ = p => String(p.id).slice(0,2);
  const cnt = t => pool.filter(p=>typ(p)===t && wdata[p.id]).length;
  const fresh = pool.filter(p=>!wdata[p.id]).sort((a,b)=>cnt(typ(a))-cnt(typ(b)))[0];
  const pct = p => { const f=wdata[p.id]?.fb; if(!f) return 99; if(typeof f.total==="number") return f.total/(typ(p)==="54"?50:30); return ((f.a?.score||0)+(f.b?.score||0))/10 };
  const next = fresh || pool.slice().sort((a,b)=>pct(a)-pct(b))[0];
  return {wroteToday, next};
}

function startDailyWords(){
  let list=wordPlan().list;

    if(!list.length) list=shuffle(ALL.filter(w=>!isDone(w.k))).slice(0,15);

}

const len53 = t => [...String(t||"").replace(/\r?\n/g,"")].length;
function warn53(t){
  const s=String(t||"").trim(); if(!s) return "";
  const out=[], n=len53(s);
  if(n<200) out.push(`あと${200-n}字で200字`); else if(n>300) out.push(`${n-300}字オーバー（300字まで）`);
  if(/(요|니다)[.!?]?(\s|$)/.test(s)) out.push("-요・-습니다 で終わる文があります。53は -다 体で");
  return out.join("／");
}

async function grade53(p){
  const text=document.getElementById("w53t").value.trim();
  const st=document.getElementById("wstat"), btn=document.getElementById("w53g");
  if(!text){ st.className="status err"; st.textContent="答えを書いてから添削できます"; return }
  const sample=await getSample(); if(!sample) return;
  const data=p.charts.map(c=>`${c.t}（${c.unit}）: `+c.rows.map(([l,v])=>`${l} ${v}`).join(", ")).join("\n")+(p.info.length?"\n"+p.info.join("\n"):"");
  const prompt=`あなたはTOPIK II 쓰기 53番（グラフ・表の説明、30点、200〜300字）の採点者です。受験者は日本語話者で、今回は${exam.goal}級を目指しています。

問題: '${p.title}'에 대한 글을 200~300자로 쓰십시오. 조사: ${p.who}
データ:
${data}

模範解答（参考）:
${p.model}

受験者の解答（${len53(text)}字）:
${text}

採点の観点（合計30点の目安）:
- 内容（グラフ・資料の情報を漏れなく正確に書いたか）
- 構成（導入→結果→理由や展望→まとめ の流れになっているか）
- 言語使用（中級レベルの文法・語彙を正確に使い、全体を -다 体（한다体）で書いているか。つづり）
字数が200字未満・300字超なら減点。

JSONだけで答えてください。形:
{"total":0,"content":"内容について日本語で1〜2文","structure":"構成について日本語で1〜2文","language":"言語使用について日本語で1〜2文（よくある間違いを具体的に）","missing":["書けていない情報（日本語で短く）"],"fixed":"受験者の文章をできるだけ生かして直した全文（韓国語、-다体、200〜300字）"}`;
  wCtl?.abort(); wCtl=new AbortController();
  btn.disabled=true; st.className="status"; st.innerHTML=`添削中…（数十秒かかることがあります） <button class="linkbtn" id="wstop">止める</button>`;
  document.getElementById("wstop").onclick=()=>wCtl.abort();
  try{
    const fb=await sample.json(prompt,{signal:wCtl.signal});
    const res={total:Math.max(0,Math.min(30,Math.round(+fb?.total||0))),content:String(fb?.content||""),structure:String(fb?.structure||""),language:String(fb?.language||""),missing:(Array.isArray(fb?.missing)?fb.missing:[]).map(String).slice(0,6),fixed:String(fb?.fixed||"")};
    saveWriting(p.id,{text,fb:res});
    if(view==="w53" && wcur===p){ st.textContent=""; render53(p,res) }
  }catch(e){
    if(view!=="w53"||wcur!==p) return;
    st.className = e?.code==="cancelled" ? "status" : "status err"; st.textContent = sampleErrText(e);
  }finally{ btn.disabled=false }
}

function warn54(t){

  return out.join("／");
}

async function grade54(p){
  const text=document.getElementById("w54t").value.trim();

  if(!text){ st.className="status err"; st.textContent="答えを書いてから添削できます"; return }
  const sample=await getSample(); if(!sample) return;
  const prompt=`あなたはTOPIK II 쓰기 54番（600〜700字の作文、50点）の採点者です。受験者は日本語話者で、今回は${exam.goal}級を目指しています。

問題: ${p.intro}
問い:
${p.qs.map((q,i)=>`${i+1}. ${q}`).join("\n")}

模範解答（参考）:
${p.model}

受験者の解答（${len54(text)}字）:
${text}

採点の観点（TOPIKの基準に合わせて）:
- 内容・課題遂行（12点）：3つの問いに全部答えているか、内容が豊かで主題に合っているか
- 文章の構成（12点）：序論・本論・結論の流れ、段落の分け方、つなぎの言葉が適切か
- 言語使用（26点）：中級〜上級の文法・語彙を正確かつ多様に使っているか、全体を -다 体（한다体）で書いているか、つづり
字数が600字未満・700字超なら減点。

JSONだけで答えてください。形:
{"content":0,"structure":0,"language":0,"contentNote":"内容について日本語で1〜2文","structureNote":"構成について日本語で1〜2文","languageNote":"言語使用について日本語で1〜2文（よくある間違いを具体的に）","missing":["答えていない問い・足りない内容（日本語で短く）"],"fixed":"受験者の文章をできるだけ生かして直した全文（韓国語、-다体、600〜700字、段落ごとに改行）"}`;
  wCtl?.abort(); wCtl=new AbortController();
  btn.disabled=true; st.className="status"; st.innerHTML=`添削中…（1分ほどかかることがあります） <button class="linkbtn" id="wstop">止める</button>`;
  document.getElementById("wstop").onclick=()=>wCtl.abort();
  try{
    const fb=await sample.json(prompt,{signal:wCtl.signal});
    const sc=(v,m)=>Math.max(0,Math.min(m,Math.round(+v||0)));
    const c=sc(fb?.content,12), s=sc(fb?.structure,12), l=sc(fb?.language,26);
    const res={total:c+s+l,c,s,l,content:String(fb?.contentNote||""),structure:String(fb?.structureNote||""),language:String(fb?.languageNote||""),missing:(Array.isArray(fb?.missing)?fb.missing:[]).map(String).slice(0,6),fixed:String(fb?.fixed||"")};
    saveWriting(p.id,{text,fb:res});
    if(view==="w54" && wcur===p){ st.textContent=""; render54(p,res) }
  }catch(e){
    if(view!=="w54"||wcur!==p) return;
    st.className = e?.code==="cancelled" ? "status" : "status err"; st.textContent = sampleErrText(e);
  }finally{ btn.disabled=false }
}

function parseBulk(text){
  const rows=[], seen=new Set();
  const push=(k,j)=>{ k=k.replace(/\s+/g," ").trim(); if(!k||seen.has(k)) return; seen.add(k); rows.push({k,j:(j||"").trim()}) };
  String(text).split(/\r?\n/).forEach(line=>{
    let s=line.trim(); if(!s) return;
    s=s.replace(/^\d+\s*[.)、．:]?\s+/,"").replace(/^[-・•*]\s*/,"");
    const cols=s.split(/\t+/).map(c=>c.trim()).filter(Boolean);
    if(cols.length>=2 && cols.every(c=>/^[가-힣\s~]+$/.test(c)||/^[—\-–]+$/.test(c))){ cols.forEach(c=>{ if(/[가-힣]/.test(c)) push(c,"") }); return }
    const m=s.match(/^([가-힣][가-힣\s~]*[가-힣~]|[가-힣])\s*[\t,，、:：=＝\/／\-–—]?\s*([^가-힣\s].*)$/);
    if(m) push(m[1],m[2]);
    else if(/^[가-힣][가-힣\s~]*$/.test(s)) push(s,"");
  });
  return rows;
}
const hasWord = k => ALL.some(x=>x.k===k);
function cleanItem(x){
  const t=(v,n)=>String(v??"").replace(/\s+/g," ").trim().slice(0,n);
  const w={k:t(x?.k,40), j:t(x?.j,80), pos:["v","a","n","adv"].includes(x?.pos)?x.pos:"", ex:t(x?.ex,160), exj:t(x?.exj,160), adv:"", chunk:t(x?.chunk,80)};
  if(w.pos==="adv") w.adv = ADV_GROUPS.some(([g])=>g===x?.adv) ? x.adv : "様子";
  return w;
}
const ITEM_SPEC = `各要素の形: {"k":"韓国語（辞書形）","j":"日本語の意味（短く。複数なら・で区切る）","pos":"v（動詞）|a（形容詞）|n（名詞）|adv（副詞・接続の言葉）","ex":"その単語（活用形でもよい）を必ず含む自然な韓国語の例文。15〜35字。한다体か해요体","exj":"例文の自然な日本語訳","adv":"posがadvのときだけ 程度|時間|確かさ|様子|つなぎ のどれか。それ以外は空文字","chunk":"よく一緒に使う形があれば「韓国語＝日本語」の形で。なければ空文字"}`;
async function claudeFill(rows,signal){
  const sample=await getSample(); if(!sample) throw {code:"not_granted"};
  const out=new Map();
  for(let i=0;i<rows.length;i+=25){
    const part=rows.slice(i,i+25);
    const prompt=`日本語話者がTOPIKに向けて使う韓国語の単語帳データを作ってください。
次の単語それぞれについて、意味・品詞・例文などを埋めてください。「｜」の右に意味が書いてあるものは、その意味を優先してください。

${part.map(r=>r.k+(r.j?"｜"+r.j:"")).join("\n")}

JSONの配列だけで答えてください。入力と同じ順番・同じ数で。
${ITEM_SPEC}`;
    const arr=await sample.json(prompt,{signal});
    (Array.isArray(arr)?arr:[]).forEach(x=>{ const w=cleanItem(x); if(w.k) out.set(w.k,w) });
  }
  return out;
}

async function saveWords(list,group,btn){

    for(const w of list){
      if(hasWord(w.k)){ done++; continue }
      const doc=Object.assign({},w,{group,created:new Date(base+done).toISOString()});
      Object.keys(doc).forEach(k=>{ if(doc[k]==="") delete doc[k] });
