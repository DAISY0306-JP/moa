<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
svg{display:block}
</style></head><body>
<svg id="ic" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#5FA898"/>
      <stop offset=".55" stop-color="#3B8A79"/>
      <stop offset="1" stop-color="#25685A"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F3EEE2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0E3A31" flood-opacity=".35"/>
    </filter>
    <pattern id="crackle" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 40 L50 30 L80 70 L120 55 M50 30 L60 0 M80 70 L70 120 M20 120 L30 85 L80 70" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#crackle)"/>
  <!-- fanned cards: A (vermilion), B (mustard), 追加 (indigo) -->
  <g transform="translate(512 540) scale(1.1)" filter="url(#sh)">
    <g transform="rotate(-20)"><rect x="-205" y="-250" width="410" height="500" rx="46" fill="#4B5FA8"/></g>
    <g transform="rotate(-11)"><rect x="-205" y="-250" width="410" height="500" rx="46" fill="#D9A21E"/></g>
    <g transform="rotate(-2)"><rect x="-205" y="-250" width="410" height="500" rx="46" fill="#C9483C"/></g>
    <g transform="rotate(6)">
      <rect x="-205" y="-250" width="410" height="500" rx="46" fill="url(#paper)"/>
      <text x="0" y="-30" text-anchor="middle" font-family="Noto Serif CJK KR" font-weight="700" font-size="168" fill="#1F5C4F" letter-spacing="0">모아</text>
      <line x1="-120" y1="62" x2="120" y2="62" stroke="#1F5C4F" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
      <line x1="-120" y1="112" x2="60" y2="112" stroke="#1F5C4F" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-120" cy="180" r="15" fill="#C9483C"/>
      <circle cx="-75" cy="180" r="15" fill="#D9A21E"/>
      <circle cx="-30" cy="180" r="15" fill="#4B5FA8"/>
    </g>
  </g>
</svg></body></html>
